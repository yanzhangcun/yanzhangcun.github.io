# Build settings
permalink: pretty
paginate: 10
paginate_path: "page:num"
markdown: kramdown
highlighter: rouge

# GitHub Pages uses plugins instead of the old gems key
plugins:
  - jekyll-paginate

exclude:
  - "less"
  - "node_modules"
  - "Gruntfile.js"
  - "package.json"
  - "package-lock.json"
  - "README.md"
  - "Gemfile"
  - "Gemfile.lock"

# Markdown settings
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Anchor settings
anchorjs: true

# Comments
# Disqus: uncomment and configure if needed.
# disqus:
#   enable: true
#   username: "your-disqus-shortname"

# Gitalk
# For a public GitHub Pages repository, avoid committing OAuth secrets directly.
gitalk:
  enable: false
  clientID: ""
  clientSecret: ""
  repo: "yanzhangcun.github.io"
  owner: "yanzhangcun"
  admin:
    - "yanzhangcun"
  distractionFreeMode: true

# Analytics
