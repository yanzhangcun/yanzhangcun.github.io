# Site settings
title: "Zhangcun Yan"
SEOTitle: "Zhangcun Yan - Homepage"
description: "Ph.D. candidate at Tongji University. Research interests include intelligent transportation systems, active traffic safety, micro-driving behavior analysis, and machine-learning-based traffic safety applications."
keyword: "Zhangcun Yan, Yan Zhangcun, Tongji University, Transportation Engineering, Intelligent Transportation Systems, Traffic Safety, Micro-driving Behavior, Machine Learning"
author: "Zhangcun Yan"
email: "zy221418@gmail.com"
lang: "en"
timezone: "Asia/Shanghai"

# Header image
header-img: "img/university-0.jpg"

# URL settings
url: "https://yanzhangcun.github.io"
baseurl: ""
github_repo: "https://github.com/yanzhangcun/yanzhangcun.github.io.git"

# Sidebar settings
sidebar: true
sidebar-about-description: "Ph.D. Candidate<br>Tongji University"
sidebar-avatar: "/img/yanzc.jpg"

# Social links
